<ng-container>
  <c-container
    [fluid]="true"
    class="border-bottom px-4"
  >
    <button
      [cSidebarToggle]="sidebarId()"
      cHeaderToggler
      class="btn"
      toggle="visible"
      style="margin-inline-start: -14px"
      aria-label="Abrir menú"
    >
      <svg
        cIcon
        name="cilMenu"
        size="lg"
      ></svg>
    </button>

    <c-header-nav class="d-none d-md-flex">
      <c-nav-item>
        <a
          cNavLink
          routerLink="/dashboard"
          routerLinkActive="active"
        >
          Inicio
        </a>
      </c-nav-item>
    </c-header-nav>

    <c-header-nav class="ms-auto">
      <ng-container
        *ngTemplateOutlet="themeDropdown"
      />

      <div class="nav-item py-1">
        <div
          class="vr h-100 mx-2 text-body text-opacity-75"
        ></div>
      </div>

      <ng-container
        *ngTemplateOutlet="userDropdown"
      />
    </c-header-nav>
  </c-container>

  <c-container
    [fluid]="true"
    class="px-4"
  >
    <c-breadcrumb-router />
  </c-container>
</ng-container>

<ng-template #userDropdown>
  <c-dropdown
    alignment="end"
    variant="nav-item"
  >
    <button
      [caret]="false"
      cDropdownToggle
      class="btn d-flex align-items-center gap-2"
      aria-label="Abrir menú de usuario"
    >
      <span class="d-none d-md-inline">
        {{ currentUser()?.fullName }}
      </span>

      <svg
        cIcon
        name="cilUser"
        size="lg"
      ></svg>
    </button>

    <ul
      cDropdownMenu
      class="pt-0"
    >
      <li>
        <h6
          cDropdownHeader
          class="bg-body-secondary py-2 rounded-top"
        >
          <span class="d-block">
            {{ currentUser()?.fullName }}
          </span>

          <small
            class="d-block text-body-secondary fw-normal"
          >
            {{ roleLabel() }}
          </small>
        </h6>
      </li>

      <li>
        <button
          cDropdownItem
          type="button"
          (click)="logout()"
          [disabled]="loggingOut()"
        >
          <svg
            cIcon
            class="me-2"
            name="cilAccountLogout"
          ></svg>

          @if (loggingOut()) {
            Cerrando sesión...
          } @else {
            Cerrar sesión
          }
        </button>
      </li>
    </ul>
  </c-dropdown>
</ng-template>

<ng-template #themeDropdown>
  <c-dropdown
    alignment="end"
    variant="nav-item"
  >
    <button
      [caret]="false"
      cDropdownToggle
      aria-label="Cambiar tema"
    >
      <svg
        cIcon
        [name]="icons()"
        size="lg"
      ></svg>
    </button>

    <div cDropdownMenu>
      @for (mode of colorModes; track mode.name) {
        <button
          cDropdownItem
          class="d-flex align-items-center"
          [active]="colorMode() === mode.name"
          (click)="colorMode.set(mode.name)"
        >
          <svg
            cIcon
            class="me-2"
            [name]="mode.icon"
            size="lg"
          ></svg>

          {{ mode.text }}
        </button>
      }
    </div>
  </c-dropdown>
</ng-template>
